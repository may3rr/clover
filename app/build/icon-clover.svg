<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f4f2"/>
    </linearGradient>
    <path id="leaf" d="M512 496
      C 436 472, 396 414, 398 348
      C 400 282, 428 238, 470 244
      C 492 250, 504 272, 512 300
      C 520 272, 532 250, 554 244
      C 596 238, 624 282, 626 348
      C 628 414, 588 466, 512 484 Z"/>
  </defs>

  <!-- squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="205" fill="url(#bg)"/>

  <!-- stem -->
  <path d="M514 512 C 562 588, 638 640, 658 756" fill="none"
        stroke="#28c840" stroke-width="30" stroke-linecap="round"/>

  <!-- four leaves: authenticity indigo / support blue / distribution teal / norms purple -->
  <g transform="translate(512 474) scale(0.88) translate(-512 -474)"
     stroke="#ffffff" stroke-width="11" stroke-linejoin="round">
    <use href="#leaf" fill="#5856d6" transform="rotate(-45 512 472)"/>
    <use href="#leaf" fill="#af52de" transform="rotate(225 512 472)"/>
    <use href="#leaf" fill="#30b0c7" transform="rotate(135 512 472)"/>
    <use href="#leaf" fill="#007aff" transform="rotate(45 512 472)"/>
  </g>
</svg>
