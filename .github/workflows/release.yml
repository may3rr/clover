# macOS release: push a tag like v0.1.0 and this builds Clover.app on an
# Apple Silicon runner (standalone Python bundled, ad-hoc signed), then
# attaches Clover-mac-arm64.dmg / .zip to the GitHub Release of that tag.
# The landing page links to releases/latest/download/Clover-mac-arm64.dmg.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14   # arm64
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Build Clover.app and dmg
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the bundled backend
        run: |
          APP="$PWD/release/mac-arm64/Clover.app/Contents/Resources"
          cd "$APP/backend"
          CITECHECK_HOME="$RUNNER_TEMP/clover" "$APP/python/bin/python3" -c "import citecheck.server; print('backend imports ok')"
          test ! -e .env && test ! -e config.toml && echo 'no secrets in bundle'
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Clover $TAG" --notes-file ../.github/release-notes.md
          gh release upload "$TAG" release/Clover-mac-arm64.dmg release/Clover-mac-arm64.zip --clobber
