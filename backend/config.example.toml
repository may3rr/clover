# citecheck configuration — copy to config.toml and adjust.
# Model names are read from here; never hard-code model names in code.
# Bump cache_version to invalidate all cached LLM verdicts (retrieval
# cache entries expire on their own 30-day TTL).
cache_version = "1"

[llm]
temperature = 0

[llm.cloud]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
timeout = 60
max_concurrency = 12

[llm.models]
judge = "qwen3.8-flash"
review = "qwen3.8-max"
review_fallback = "qwen3.7-max"
typo = "qwen3.8-flash"
extract = "qwen3.7-flash"
structure = "qwen3.7-flash"
function = "qwen3.7-flash"
profile = "qwen3.8-flash"
overview = "qwen3.8-max"

[llm.local]
enabled = false
model = "mlx-community/Qwen2.5-3B-Instruct-4bit"
hf_endpoint = "https://hf-mirror.com"
timeout = 20

[llm.embedding]
# Qwen3-Embedding fused with BM25 when ranking excerpt windows. Sends the
# cited PDFs' text to the embedding service, so it is off by default.
enabled = false
base_url = "https://api.siliconflow.cn/v1"
model = "Qwen/Qwen3-Embedding-0.6B"
api_key_env = "SILICONFLOW_API_KEY"

[llm.rerank]
# Qwen3-Reranker over the top fused candidates (needs [llm.embedding]).
# api_format = "dashscope" uses base_url as the full native rerank endpoint.
enabled = false
base_url = "https://api.siliconflow.cn/v1"
model = "Qwen/Qwen3-Reranker-0.6B"
api_key_env = "SILICONFLOW_API_KEY"
api_format = "siliconflow"

[support]
# re-judge each flagged pair on a second, BM25-only excerpt and keep the
# flag only when both agree; needs [llm.embedding] for the excerpts to differ
dual_excerpt = false

[retrieval]
concurrency = 4
timeout = 15
retries = 2

[cache]
path = "~/Library/Application Support/citecheck/cache.sqlite"
