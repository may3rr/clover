# citecheck configuration — copy to config.toml and adjust.
# Model names are read from here; never hard-code model names in code.
# Bump cache_version to invalidate all cached LLM verdicts (retrieval
# cache entries expire on their own 30-day TTL).
cache_version = "1"

[llm]
temperature = 0

[llm.cloud]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
timeout = 60
max_concurrency = 12
# 网络中断、超时、限流和服务端 5xx 按指数退避重试，总等待不超过这么多秒
retry_seconds = 180

[llm.models]
judge = "qwen3.8-flash"
review = "qwen3.8-max"
review_fallback = "qwen3.7-max"
typo = "qwen3.8-flash"
extract = "qwen3.7-flash"
structure = "qwen3.7-flash"
function = "qwen3.7-flash"
profile = "qwen3.8-flash"
overview = "qwen3.8-max"

[llm.local]
# extract (claim extraction, bibliography guessing) on this machine, cloud
# as fallback. engine "mlx": Apple silicon, model is an mlx-community repo.
# engine "openvino": Intel, model is an OpenVINO IR directory, e.g.
# "D:/clover-models/Qwen3-1.7B-int4-ov"; device is tried left to right
# (pip install -e .[intel]).
enabled = false
engine = "mlx"
model = "mlx-community/Qwen2.5-3B-Instruct-4bit"
hf_endpoint = "https://hf-mirror.com"
timeout = 20
# device = "NPU,GPU,CPU"
# Continuous batching (Intel GPU): queued requests are grouped and served
# by one ContinuousBatchingPipeline. Measured on Arc B370 with 8B-int4:
# 16 concurrent / 1315 prompt tokens -> 122 tok/s, ~1.05 s/request, ~8 GB
# RSS; prefix caching on shared prompts raises it to ~158 tok/s. Keep
# cache_size <= 6 so Electron + the backend still fit.
batching = false
batch_max_num_seqs = 16
batch_cache_size = 6.0
batch_max_num_batched_tokens = 32768
batch_prefix_caching = true
batch_wait_ms = 30
# Tasks tried locally first, then cloud. Start with extract; on the Intel
# machine judge/typo/function can be added once local quality is checked.
tasks = ["extract"]
# Local concurrency is separate from [llm.cloud].max_concurrency.
max_concurrency = 8

[llm.embedding]
# Bailian text-embedding-v4 (Qwen3-based) fused with BM25 when ranking
# excerpt windows. The cited PDFs' text is sent to Bailian in windows;
# the settings page turns this and [llm.rerank] off together. SiliconFlow
# works too: base_url "https://api.siliconflow.cn/v1", model
# "Qwen/Qwen3-Embedding-0.6B", api_key_env "SILICONFLOW_API_KEY", batch 32.
enabled = true
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "text-embedding-v4"
api_key_env = "DASHSCOPE_API_KEY"
batch = 10
# On-device instead (no text leaves the machine):
# backend = "openvino"
# local_model = "D:/clover-models/Qwen3-Embedding-0.6B-int8-ov"
# device = "NPU,GPU,CPU"

[llm.rerank]
# Bailian qwen3-rerank over the top fused candidates (needs [llm.embedding]).
# api_format = "dashscope" uses base_url as the full native rerank endpoint;
# for SiliconFlow use base_url "https://api.siliconflow.cn/v1", model
# "Qwen/Qwen3-Reranker-0.6B", api_format "siliconflow".
enabled = true
base_url = "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank"
model = "qwen3-rerank"
api_key_env = "DASHSCOPE_API_KEY"
api_format = "dashscope"
# backend = "openvino"
# local_model = "D:/clover-models/Qwen3-Reranker-0.6B-int8-ov"

[support]
# re-judge each flagged pair on a second, BM25-only excerpt and keep the
# flag only when both agree; needs [llm.embedding] for the excerpts to differ
dual_excerpt = false

[retrieval]
concurrency = 4
timeout = 15
retries = 2

[venue]
# 期刊对标细化：用模型给范文的章节标题归类、读出研究要素、给范文的引用
# 分类。会把范文的标题、摘要、章节标题、图表题注和含引用的句子发送到
# 模型服务商；关闭后只做本地规则统计。
model = true

[cache]
path = "~/Library/Application Support/citecheck/cache.sqlite"
